# Copy to auth.yml. NEVER commit the real auth.yml.
#
# snmp-exporter merges this on top of its built-in module file. The key here
# ("cyberpower_v1") must match the `auth:` parameter in prometheus.yml.
#
# SNMPv1/v2c community strings are sent in cleartext on the wire and are
# effectively a shared password. Do not leave them at "public", and prefer
# SNMPv3 if your management card supports it.

auths:
  cyberpower_v1:
    version: 1
    community: CHANGE_ME

  # SNMPv3 example — authenticated and encrypted:
  # cyberpower_v3:
  #   version: 3
  #   username: CHANGE_ME
  #   security_level: authPriv
  #   password: CHANGE_ME
  #   auth_protocol: SHA
  #   priv_protocol: AES
  #   priv_password: CHANGE_ME
