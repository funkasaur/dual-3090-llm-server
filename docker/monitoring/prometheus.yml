global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting lives in Grafana, not here. Grafana can deliver notifications on its
# own; Prometheus rules cannot without an Alertmanager, and running both meant
# two copies of the same rules drifting apart. Re-enable this stanza if you
# add an Alertmanager:
#
# rule_files:
#   - /etc/prometheus/gpu-alert.yaml

scrape_configs:
  - job_name: 'node'
    static_configs:
      # node-exporter runs on the host network, so scrape it at the ai-net gateway (= this host).
      # REPLACE 192.168.32.1 with yours: docker network inspect ai-net -f '{{(index .IPAM.Config 0).Gateway}}'
      - targets: ['192.168.32.1:9100']
    relabel_configs:
      - target_label: instance  # keep the old label so alerts and dashboards still match
        replacement: 'node-exporter:9100'

  - job_name: 'dcgm'
    static_configs:
      - targets: ['dcgm-exporter:9400']  # Monitor GPU VRAM/Temp

  - job_name: 'cyberpower_ups'
    static_configs:
      - targets:
        - 192.0.2.114  # The IP address of the Server's UPS
        - 192.0.2.62  # The IP address of the Desktop's UPS
        - 192.0.2.59  # Rack UPS (CP2000PFCRM2U with an RMCARD205)
    metrics_path: /snmp
    params:
      module: [cyberpower]    # Tells the exporter to use the built-in CyberPower map
      auth: [cyberpower_v1]   # Matches the auth block you created in snmp.yml (or use cyberpower_v1)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116  # Docker DNS name routing
  - job_name: 'llama-swap'
    static_configs:
      - targets: ['192.0.2.26:3060']
  - job_name: 'llama-swap-activity'
    static_configs:
      - targets: ['192.0.2.26:9105']
  - job_name: 'smartlife'
    scrape_interval: 60s
    static_configs:
      - targets: ['smartlife-exporter:9106']
  # NVMe SMART (smartctl-exporter). Values refresh every 5 min inside the exporter.
  - job_name: 'smartctl'
    scrape_interval: 60s
    static_configs:
      - targets: ['smartctl-exporter:9633']
