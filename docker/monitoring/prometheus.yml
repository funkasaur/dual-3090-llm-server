global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting lives in Grafana, not here. Grafana can deliver notifications on its
# own; Prometheus rules cannot without an Alertmanager, and running both meant
# two copies of the same rules drifting apart. Re-enable this stanza if you
# add an Alertmanager:
#
# rule_files:
#   - /etc/prometheus/gpu-alert.yaml

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']  # Monitor System RAM/CPU

  - job_name: 'dcgm'
    static_configs:
      - targets: ['dcgm-exporter:9400']  # Monitor GPU VRAM/Temp

  - job_name: 'cyberpower_ups'
    static_configs:
      - targets:
        - 10.0.0.114  # The IP address of the Server's UPS
        - 10.0.0.62  # The IP address of the Desktop's UPS
    metrics_path: /snmp
    params:
      module: [cyberpower]    # Tells the exporter to use the built-in CyberPower map
      auth: [cyberpower_v1]   # Matches the auth block you created in snmp.yml (or use cyberpower_v1)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116  # Docker DNS name routing
  - job_name: 'llama-swap'
    static_configs:
      - targets: ['10.0.0.26:3060']
  - job_name: 'llama-swap-activity'
    static_configs:
      - targets: ['10.0.0.26:9105']      
