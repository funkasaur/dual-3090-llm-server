# NOTE: this file is no longer loaded by Prometheus on the reference
# deployment. Alerting was consolidated into Grafana, which can deliver
# notifications on its own; Prometheus rules cannot without an
# Alertmanager, and running both meant two copies drifting apart.
#
# Kept because it is the better-documented form of the same rules, and it
# is what you want if you do run an Alertmanager. To re-enable: mount it
# into the prometheus container and restore the rule_files stanza in
# prometheus.yml. See docs/monitoring.md.

# GPU and UPS alerting rules.
#
# Metric names below are UPPERCASE because that is what dcgm-exporter actually
# emits (DCGM_FI_DEV_GPU_TEMP, not dcgm_fi_dev_gpu_temp). PromQL is
# case-sensitive, so the lowercase form silently matches nothing — a rule that
# loads, evaluates, and can never fire.
#
# Verify any metric before writing a rule against it:
#   curl -s localhost:2400/metrics | grep -oE '^DCGM[A-Z_]+' | sort -u

groups:
  - name: RTX_3090_GPU_Alerts
    rules:

      # --- Thermals -----------------------------------------------------
      # A 3090 core throttles near 83C. The original rule fired at 65C and
      # called that "close to thermal throttling limits", which is simply
      # normal load temperature.
      - alert: GpuCoreTemperatureHigh
        expr: DCGM_FI_DEV_GPU_TEMP > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} core at {{ $value }}C"
          description: "Sustained above 80C. The 3090 core throttles near 83C; check airflow and fan curves."

      - alert: GpuCoreTemperatureCritical
        expr: DCGM_FI_DEV_GPU_TEMP > 84
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.gpu }} core at {{ $value }}C"
          description: "At or past the throttle point. Expect clock loss and reduced tokens/sec."

      # --- VRAM ---------------------------------------------------------
      # The original expression divided used by FREE rather than TOTAL, so on a
      # card with 20GB used and 4GB free it evaluated to 500% and fired
      # permanently, while being unable to express "95% full" at all.
      - alert: GpuVramExhausted
        expr: >-
          (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) * 100 > 95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} VRAM {{ $value | printf \"%.1f\" }}% full"
          description: "Little headroom left. Further model loads or long contexts will OOM."

      # --- Hardware faults ----------------------------------------------
      # XID errors are the GPU reporting an actual fault: bad memory, a card
      # that fell off the bus, a double-bit ECC event. Rare, and always worth
      # knowing about on a box running unattended inference.
      - alert: GpuXidErrors
        expr: increase(DCGM_FI_DEV_XID_ERRORS[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.gpu }} reported an XID error"
          description: "Check `dmesg | grep -i xid` — this is a hardware or driver fault, not a load issue."

      # --- Power --------------------------------------------------------
      # The cards are capped at 270W. Sustained draw at the cap is normal under
      # load; sustained draw above it means the cap is not being applied, which
      # is how nvidia-power-limit.service would fail silently.
      - alert: GpuPowerCapNotApplied
        expr: DCGM_FI_DEV_POWER_USAGE > 290
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} drawing {{ $value }}W, above the 270W cap"
          description: "Check: systemctl status nvidia-power-limit.service && nvidia-smi -q -d POWER"

      # --- Liveness -----------------------------------------------------
      - alert: GpuExporterDown
        expr: up{job="dcgm"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "dcgm-exporter is down"
          description: "No GPU telemetry. Every thermal and VRAM alert above is blind while this fires."

      - alert: InferenceEngineDown
        expr: up{job="llama-swap"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "llama-swap is not responding"
          description: "The inference endpoint is unreachable; Open WebUI will fail every request."

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node-exporter is down"
          description: "No host CPU, RAM, disk or per-CCD temperature data."

  # ---------------------------------------------------------------------
  # NOT INCLUDED, because this dcgm-exporter does not expose the metrics:
  #
  #   GpuMemoryJunctionHot    needs DCGM_FI_DEV_MEMORY_TEMP
  #   GpuHardwareThrottling   needs DCGM_FI_DEV_CLOCK_THROTTLE_REASONS
  #
  # dcgm-exporter 2.3.2 ships a default counter set of 15 fields and neither is
  # in it. GDDR6X junction temperature is the failure mode that actually
  # degrades 3090s — memory runs far hotter than the core and throttles at
  # 110C — so it is worth enabling with a custom counters file:
  #
  #   DCGM_FI_DEV_MEMORY_TEMP,            gauge, Memory junction temperature (C).
  #   DCGM_FI_DEV_CLOCK_THROTTLE_REASONS, gauge, Clock throttle reason bitmask.
  #
  # Mount it as /etc/dcgm-exporter/custom-counters.csv, pass
  # `-f /etc/dcgm-exporter/custom-counters.csv`, then add the rules back.
  # The throttle field is a BITMASK whose bit 0 is "GPU idle" and bit 2 is
  # "SW power cap", both permanently set here — alert on `>= 8` to isolate real
  # hardware and thermal slowdowns.
  # ---------------------------------------------------------------------

  - name: UPS_Alerts
    rules:
      # Values verified against a live CyberPower RMCARD205 via snmp-exporter.
      # upsBaseOutputStatus: 2 = onLine.
      - alert: UpsOnBattery
        expr: upsBaseOutputStatus != 2
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "UPS {{ $labels.instance }} is not on mains power"
          description: "Output status {{ $value }}. Begin a graceful shutdown before the battery runs out."

      # upsBaseBatteryStatus: 2 = normal.
      - alert: UpsBatteryAbnormal
        expr: upsBaseBatteryStatus != 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "UPS {{ $labels.instance }} battery not normal"
          description: "Battery status {{ $value }}. Check for a failed or ageing battery pack."

      - alert: UpsLoadHigh
        expr: upsAdvanceOutputLoad > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "UPS {{ $labels.instance }} at {{ $value }}% load"
          description: "Approaching rated capacity. Lower POWER_LIMIT_W or move load off this UPS."

      # Reported in TimeTicks (1/100 s), so 6000 ticks = one minute.
      - alert: UpsRuntimeLow
        expr: upsAdvanceBatteryRunTimeRemaining / 6000 < 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "UPS {{ $labels.instance }} has under 5 minutes of runtime"
          description: "Shut down now."
