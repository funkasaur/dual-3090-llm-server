services:
  # 1. The Database (Stores metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    cpuset: "8-15,24-31" # Strictly on CCD1
    restart: unless-stopped
    ports:
      - "2090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # - ./gpu-alert.yaml:/etc/prometheus/gpu-alert.yaml:ro  (Grafana owns alerting)
      - prom_data:/prometheus
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=2y'
    networks:
      - ai-net

  # 2. The Dashboard (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    cpuset: "8-15,24-31" # Strictly on CCD1
    restart: unless-stopped
    ports:
      - "2000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - prometheus
    networks:
      - ai-net

  # 3. System Metrics (RAM, CPU, Disk)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    cpuset: "8-15,24-31" # Strictly on CCD1
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      # Picks up gpu_vram_temps.prom, written by gpu-vram-temps.timer on the
      # host. No extra mount needed: / is already bind-mounted at /host, and
      # the collector only ever reads.
      - '--collector.textfile.directory=/host/var/lib/node_exporter/textfile_collector'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - ai-net

  # 4. GPU Metrics (VRAM, Temp, Power)
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:2.3.2-2.6.2-ubuntu20.04
    container_name: dcgm-exporter
    # dcgm-exporter stamps every metric with a Hostname label taken from the
    # container's hostname, which Docker sets to the container ID. Recreating
    # the container therefore changes the label, splitting the history into
    # disjoint series and stranding any dashboard variable or alert pinned to
    # the old value. Pinning it keeps the label stable across recreates.
    hostname: llm-server
    cpuset: "8-15,24-31" # Strictly on CCD1
    restart: unless-stopped
    ports:
      - "2400:9400"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    runtime: nvidia  # Critical for GPU access
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    cap_add:
      - SYS_ADMIN
    networks:
      - ai-net

  # 5. UPS Metrics
  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp-exporter
    cpuset: "8-15,24-31" # Strictly on CCD1
    ports:
      - "9116:9116"
    volumes:
      - ./auth.yml:/etc/snmp_exporter/auth.yml
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      # Load the container's built-in 10,000+ line module file
      - "--config.file=/etc/snmp_exporter/snmp.yml"
      # Load your custom credentials and merge them
      - "--config.file=/etc/snmp_exporter/auth.yml"
    restart: unless-stopped
    networks:
      - ai-net

  # 6. Llama-swap metrics
  llamaswap-exporter:
    build: ./llamaswap-exporter
    container_name: llamaswap-exporter
    cpuset: "8-15,24-31" # Strictly on CCD1
    restart: unless-stopped
    ports:
      - "9105:9105"
    networks:
      - ai-net


  # 7. Smart Life (Tuya) plug power per device. One-time login:
  #    docker compose run --rm smartlife-exporter python login.py <USER_CODE>
  smartlife-exporter:
    build: ./smartlife-exporter
    container_name: smartlife-exporter
    cpuset: "8-15,24-31" # Strictly on CCD1
    restart: unless-stopped
    ports:
      - "9106:9106"
    volumes:
      - ./smartlife-exporter/data:/data
      - ./smartlife-exporter/topology.json:/app/topology.json:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - ai-net

volumes:
  prom_data:
  grafana_data:
networks:
  ai-net:
    external: true
