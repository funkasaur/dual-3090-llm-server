# llama-swap configuration (trimmed example).
#
# llama-swap listens on one port and starts/stops backend processes on demand.
# A request naming model X causes llama-swap to launch X's `cmd`, proxy to it,
# and unload it after `ttl` seconds of inactivity. ${PORT} is substituted by
# llama-swap with a free port.
#
# Two backends. The main model runs llamAmpere (a llama.cpp fork with Ampere
# attention kernels, built from ../../llamampere/ and mounted at /opt/llamampere).
# Everything else runs ik-llama-server (the ik_llama.cpp fork shipped in the
# llama-swap image), which also keeps the previous configuration of the main
# model as a fallback entry. The two accept different flags; see docs/inference.md.

# Unload an idle model after this many seconds unless overridden per model.
globalTTL: 300

# Large Q8 models on two cards can take well over a minute to load; do not let
# the health check give up before the weights are resident.
healthCheckTimeout: 180

models:

  # ---------------------------------------------------------------------
  # Dense 27B at Q8 across both cards: the main model, on llamAmpere.
  #
  # Threading: cpuset "0-4" (five physical cores, no SMT siblings). With every
  # layer on the GPUs, generation keeps one core busy, so 5/5 is plenty.
  #
  # --split-mode tensor: tensor parallelism over NVLink (NCCL). --tensor-split
  # 49.5,50.5 leaves ~2.5 GB free on GPU0 for the reranker that shares it; the
  # split moves in ~1.9 GB steps, and 47/53 runs GPU1 out of memory.
  #
  # --cache-ram: host-RAM prompt cache. With local patch 0001 a ~130k session
  # costs ~7 GB, so 32 GB holds about four before evicting one.
  # ---------------------------------------------------------------------
  Qwen-27B-Q8:
    cmd: >
      /opt/llamampere/llama-server
      --model /models/<your-model>/Qwen-27B-Q8_0.gguf
      --port ${PORT}
      --ctx-size 262144
      --n-predict 32768
      --batch-size 4096
      --ubatch-size 1024
      --n-gpu-layers 99
      --threads 5
      --threads-batch 5
      --split-mode tensor
      --tensor-split 49.5,50.5
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --parallel 1
      --jinja
      --fit off
      --cache-prompt
      --cache-ram 32768
      --ctx-checkpoints 16
      --spec-type draft-mtp
      --spec-draft-n-max 3
      --spec-draft-p-min 0
      --spec-draft-type-k q8_0
      --spec-draft-type-v q8_0
      --reasoning-budget 16384
      --reasoning-budget-message "Final Answer:\nBased on my analysis above,"
      --chat-template-kwargs '{"reasoning_effort":"medium"}'
      --temp 1.0 --min-p 0.0 --top-p 0.95 --top-k 20 --presence-penalty 0.0 --repeat-penalty 1.0
    env:
      # Replaces the container's LD_LIBRARY_PATH, so the CUDA path is repeated.
      - "LD_LIBRARY_PATH=/opt/llamampere:/usr/local/cuda/lib64"
      - "GGML_Q8_TURBO3_MMA_FUSED=1"
    # ttl: 0 keeps this model resident forever. Use it for the model you
    # actually work in, so you never pay the reload cost.
    ttl: 0

  # ---------------------------------------------------------------------
  # The same model on ik_llama: the previous configuration, kept as the
  # rollback. Swap the two keys to switch engines.
  # ---------------------------------------------------------------------
  Qwen-27B-Q8-ik:
    cmd: >
      ik-llama-server
      --model /models/<your-model>/Qwen-27B-Q8_0.gguf
      --port ${PORT}
      --ctx-size 262144
      --n-predict 32768
      --batch-size 4096
      --ubatch-size 1024
      --n-gpu-layers 99
      --threads 5
      --threads-batch 5
      --cache-ram 16384
      --split-mode graph
      --spec-type mtp:n_max=4,p_min=0.8
      --ctx-checkpoints 16
      --jinja
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --reasoning-budget 16384
      --reasoning-budget-message "Final Answer:\nBased on my analysis above,"
      --chat-template-kwargs '{"reasoning_effort":"medium"}'
      --temp 1.0 --min-p 0.0 --top-p 0.95 --top-k 20 --presence-penalty 0.0 --repeat-penalty 1.0
    ttl: 0

  # ---------------------------------------------------------------------
  # Same weights with a vision projector attached.
  # ---------------------------------------------------------------------
  Qwen-27B-Q8-Vision:
    cmd: >
      ik-llama-server
      --model /models/<your-model>/Qwen-27B-Q8_0.gguf
      --mmproj /models/<your-model>/mmproj-BF16.gguf
      --port ${PORT}
      --ctx-size 131072
      --batch-size 4096
      --ubatch-size 1024
      --n-gpu-layers 99
      --threads 5
      --threads-batch 5
      --threads-mtmd 5
      --mtmd-kq-type f16
      --split-mode graph
      --jinja
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
    ttl: 600

  # ---------------------------------------------------------------------
  # A small model kept on a short TTL for cheap utility calls (title
  # generation, tag extraction, autocomplete from the WebUI).
  # ---------------------------------------------------------------------
  Qwen-2B-Q5:
    cmd: >
      ik-llama-server
      --model /models/<your-model>/Qwen-2B-UD-Q5_K_XL.gguf
      --port ${PORT}
      --ctx-size 32768
      --n-gpu-layers 99
      --threads 5
      --flash-attn on
      --jinja
    ttl: 300
