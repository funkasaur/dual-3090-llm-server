# llama-swap configuration (trimmed example).
#
# llama-swap listens on one port and starts/stops backend processes on demand.
# A request naming model X causes llama-swap to launch X's `cmd`, proxy to it,
# and unload it after `ttl` seconds of inactivity. ${PORT} is substituted by
# llama-swap with a free port.
#
# The backend here is ik-llama-server (the ik_llama.cpp fork), which adds the
# quantisation types, MTP speculative decoding and `--split-mode graph` used
# below. Plain llama-server will reject several of these flags.

# Unload an idle model after this many seconds unless overridden per model.
globalTTL: 300

# Large Q8 models on two cards can take well over a minute to load; do not let
# the health check give up before the weights are resident.
healthCheckTimeout: 180

models:

  # ---------------------------------------------------------------------
  # Dense 27B at Q8 across both cards.
  #
  # Threading, for a 5-physical-core inference zone (cores 0-4 + SMT 16-20):
  #   --threads 5        generation is latency-bound; one thread per physical
  #                      core, no SMT, avoids sibling contention.
  #   --threads-batch 10 prompt processing is throughput-bound and does
  #                      benefit from SMT, so use all 10 logical CPUs.
  #
  # This only works if the container is actually given both the cores and
  # their SMT siblings — cpuset "0-4,16-20", not "0-4". See docs/cpu-topology.md.
  # ---------------------------------------------------------------------
  Qwen-27B-Q8:
    cmd: >
      ik-llama-server
      --model /models/<your-model>/Qwen-27B-Q8_0.gguf
      --port ${PORT}
      --ctx-size 262144
      --batch-size 4096
      --ubatch-size 1024
      --n-gpu-layers 99
      --threads 5
      --threads-batch 10
      --split-mode graph
      --ctx-checkpoints 64
      --jinja
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --temp 1.0 --min-p 0.0 --top-p 0.95 --top-k 20
    # ttl: 0 keeps this model resident forever. Use it for the model you
    # actually work in, so you never pay the reload cost.
    ttl: 0

  # ---------------------------------------------------------------------
  # Same weights with a vision projector attached.
  # ---------------------------------------------------------------------
  Qwen-27B-Q8-Vision:
    cmd: >
      ik-llama-server
      --model /models/<your-model>/Qwen-27B-Q8_0.gguf
      --mmproj /models/<your-model>/mmproj-BF16.gguf
      --port ${PORT}
      --ctx-size 131072
      --batch-size 4096
      --ubatch-size 1024
      --n-gpu-layers 99
      --threads 5
      --threads-batch 10
      --threads-mtmd 5
      --mtmd-kq-type f16
      --split-mode graph
      --jinja
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
    ttl: 600

  # ---------------------------------------------------------------------
  # A small model kept on a short TTL for cheap utility calls (title
  # generation, tag extraction, autocomplete from the WebUI).
  # ---------------------------------------------------------------------
  Qwen-2B-Q5:
    cmd: >
      ik-llama-server
      --model /models/<your-model>/Qwen-2B-UD-Q5_K_XL.gguf
      --port ${PORT}
      --ctx-size 32768
      --n-gpu-layers 99
      --threads 5
      --flash-attn on
      --jinja
    ttl: 300
