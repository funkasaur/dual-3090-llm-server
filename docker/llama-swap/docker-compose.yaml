# Inference engine: llama-swap fronting llamAmpere and ik-llama-server.
#
# llama-swap is the model router/lifecycle manager: it listens on one port,
# starts the right backend process on demand, and unloads it after its TTL.
# The main model runs llamAmpere, built from ../../llamampere/ and mounted
# read-only below; everything else runs ik-llama-server from the image.

services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda
    container_name: llama-swap-unified

    # Five physical cores, one hardware thread each; their SMT siblings
    # (16-20 on a 5950X, where the sibling of core N is N+16) stay with the
    # host. Matches --threads 5 / --threads-batch 5. With every layer on the
    # GPUs, generation keeps one core busy. Use "0-4,16-20" for all ten.
    # See docs/cpu-topology.md and AUDIT #2.
    cpuset: "0-4"

    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Required for NVLink / CUDA P2P between the two cards.
    ipc: host
    shm_size: "16gb"

    command: --config /app/config/config.yaml --watch-config
    ports:
      - "3060:8080"

    volumes:
      - ${MODELS_DIR:-/models}:/models:ro
      - ./config:/app/config
      # llama-swap's activity store (sqlite); survives container restarts.
      - ./data:/app/data
      # The llamAmpere build (see llamampere/build.sh).
      - ./llamampere/bin:/opt/llamampere:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - LLAMA_ATTN_ROT_DISABLE=1
      # One OpenMP thread per physical core in the inference zone.
      - OMP_NUM_THREADS=5
      # NOT "close": with binding on, libgomp pins the main thread to the
      # first core at load and every later thread inherits it, confining the
      # whole server to core 0. OMP_PLACES alone implies binding. AUDIT #12.
      - OMP_PROC_BIND=false

    # Lets the engine mlock weights so they are never swapped out.
    cap_add:
      - IPC_LOCK

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    networks:
      - ai-net

networks:
  ai-net:
    external: true
