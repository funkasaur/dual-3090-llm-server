# Inference engine: llama-swap fronting llamAmpere and ik-llama-server.
#
# llama-swap is the model router/lifecycle manager: it listens on one port,
# starts the right backend process on demand, and unloads it after its TTL.
# The main model runs llamAmpere, built from ../../llamampere/ and mounted
# read-only below; everything else runs ik-llama-server from the image.

services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda
    container_name: llama-swap-unified

    # Two physical cores (1-2) with their SMT siblings (17-18 on a 5950X,
    # where the sibling of core N is N+16). Core 0 is left to the kernel's
    # housekeeping. Matches --threads 2 / --threads-batch 2. With every layer
    # on the GPUs, generation keeps one core busy (it spin-waits on the GPU);
    # an A/B found no difference against five cores. See docs/cpu-topology.md.
    cpuset: "1-2,17-18"

    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Required for NVLink / CUDA P2P between the two cards.
    ipc: host
    shm_size: "16gb"

    command: --config /app/config/config.yaml --watch-config
    ports:
      - "3060:8080"

    volumes:
      - ${MODELS_DIR:-/models}:/models:ro
      - ./config:/app/config
      # llama-swap's activity store (sqlite); survives container restarts.
      - ./data:/app/data
      # The llamAmpere build (see llamampere/build.sh).
      - ./llamampere/bin:/opt/llamampere:ro
      # llamAmpere's prompt-cache disk tier: the RAM prompt cache is written here at unload
      # and restored at the next load of the same model + KV config (~1.4 s for a 33k prompt vs ~20 s
      # prefill). Without this mount it sits in the container layer and is lost on every re-create.
      - ./prompt-cache:/root/.cache/llamampere
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Explicit NVIDIA device nodes. With Docker's systemd cgroup driver on
    # cgroup v2, a host `systemctl daemon-reload` can drop the GPU device
    # permissions the nvidia runtime injected; new model loads then fail with
    # "Failed to initialize NVML: Unknown Error" until a restart. Devices
    # listed here go into the container's own cgroup rules and survive a
    # reload. Keep the deploy block above (it injects the driver libraries).
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidia1:/dev/nvidia1
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia-modeset:/dev/nvidia-modeset

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - LLAMA_ATTN_ROT_DISABLE=1
      # One OpenMP thread per physical core in the inference zone.
      - OMP_NUM_THREADS=2
      # NOT "close": with binding on, libgomp pins the main thread to the
      # first core at load and every later thread inherits it, confining the
      # whole server to core 0. OMP_PLACES alone implies binding. AUDIT #12.
      - OMP_PROC_BIND=false
      # With OMP_PROC_BIND=false this binds nothing; threads stay free across the cpuset.
      - OMP_PLACES=cores

    # Lets the engine mlock weights so they are never swapped out.
    cap_add:
      - IPC_LOCK

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    networks:
      - ai-net

networks:
  ai-net:
    external: true
