services:
  qdrant:
    # PATCH: pinned deliberately. Qdrant guarantees storage compatibility for
    # only ONE minor version, so upgrades must step through every minor:
    # 1.17.x -> 1.18.x -> 1.19.x. A `:latest` tag on a stateful database lets a
    # routine `docker compose pull` skip a minor version silently, which is
    # unsupported. Bump this by hand, one minor at a time, snapshot first.
    # https://qdrant.tech/documentation/upgrades/
    image: qdrant/qdrant:v1.19.1
    container_name: qdrant
    cpuset: "8-15,24-31"        # CCD1
    restart: unless-stopped
    networks:
      - ai-net
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
      # PATCH: /qdrant/snapshots defaults to the container's WRITABLE LAYER,
      # not a volume. Without this mount the snapshots your backup pre-hook
      # creates are invisible to any host-level backup, are destroyed by
      # `docker compose down` or an image update, and grow without bound
      # inside the container. See docs/AUDIT.md #12.
      - ./qdrant_snapshots:/qdrant/snapshots
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      # Qdrant has no auth by default. If you expose these ports beyond a
      # trusted LAN, set an API key and require it:
      # - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}

networks:
  ai-net:
    external: true
